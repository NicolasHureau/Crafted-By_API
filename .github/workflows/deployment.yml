name: deployment.yml
on:
  push:
    branches:
      - 'prod'
    paths:
      - 'version.txt'

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - name: Set Version Environment Variable
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
      - name: Build Docker image
        run: docker build . -t nicolashureau/crafted_by_api:latest -t nicolashureau/crafted_by_api:${{env.VERSION}}
      - name: Log in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name : Push Docker Image
        run: docker push nicolashureau/crafted_by_api:${{ env.VERSION }}

  deploy_to_server:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - name: Set Version Environment Variable
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd dockerfiles/api/
            sed -i "s|nicolashureau/crafted_by_api:.*|nicolashureau/crafted_by_api:${{ env.VERSION }}|g" docker-compose.yml
            sudo docker pull nicolashureau/crafted_by_api:${{ env.VERSION }}
            sudo docker compose up -d
